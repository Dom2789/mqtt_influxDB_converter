[project.scripts]
mqtt-influx-bridge = "mqtt_influx_bridge.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mqtt_influx_bridge"]

[dependency-groups]
dev = ["pytest>=8"]

[project]
name = "mqtt-influxdb-converter"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "influxdb-client>=1.50.0",
    "paho-mqtt>=2.1.0",
    "python-dotenv>=1.2.4",
    "tomli-w>=1.2.0",
]
